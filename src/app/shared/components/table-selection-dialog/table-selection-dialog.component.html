<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <!-- Search Field -->
  <mat-form-field appearance="outline" class="w-full mb-4">
    <mat-label><ng-container i18n>Search tables</ng-container></mat-label>
    <input 
      matInput 
      [value]="searchQuery()" 
      (input)="onSearchChange($any($event.target).value)"
      placeholder="Search by table name..." i18n-placeholder>
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <!-- Loading State -->
  @if (tablesResource.isLoading()) {
    <div class="flex items-center justify-center py-12">
      <mat-spinner></mat-spinner>
    </div>
  }

  <!-- Error State -->
  @if (tablesResource.error()) {
    <app-no-record 
      icon="error_outline"
      title="Failed to Load Tables" i18n-title
      message="Unable to load tables. Please try again." i18n-message>
    </app-no-record>
  }

  <!-- Tables Grid -->
  @if (tablesResource.value() && !tablesResource.isLoading()) {
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[60vh] overflow-y-auto">
      @for (table of filteredTables; track $index) {
        <div [class.opacity-50]="!isSelectable(table)" [class.pointer-events-none]="!isSelectable(table)">
          <app-table-card 
            [table]="table"
            [hideActions]="true"
            (tableClick)="onTableSelect($event)">
          </app-table-card>
        </div>
      }
    </div>

    @if (filteredTables.length === 0) {
        <app-no-record
          icon="table_restaurant"
          title="No Tables Found" i18n-title
          message="No tables match your search criteria." i18n-message>
        </app-no-record>
    }
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (selectedTable()) {
    <button mat-button color="warn" (click)="onRemoveSelection()">
      <ng-container i18n>Remove Selection</ng-container>
    </button>
  }
  <button mat-button (click)="onCancel()"><ng-container i18n>Cancel</ng-container></button>
</mat-dialog-actions>

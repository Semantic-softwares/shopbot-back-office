@if (variant() === 'icon') {
  <button
    mat-icon-button
    [matMenuTriggerFor]="actionsMenu"
    (click)="$event.stopPropagation()"
    aria-label="Invoice actions" i18n-aria-label
  >
    <mat-icon>more_horiz</mat-icon>
  </button>
} @else {
  <button
    mat-stroked-button
    [matMenuTriggerFor]="actionsMenu"
    (click)="$event.stopPropagation()"
    aria-label="Invoice actions" i18n-aria-label
  >
    <mat-icon>more_vert</mat-icon>
    <ng-container i18n>Actions</ng-container>
  </button>
}

<mat-menu #actionsMenu="matMenu">
  @if (canMarkAsPaid()) {
    <button mat-menu-item (click)="openMarkAsPaid()">
      <mat-icon>payments</mat-icon>
      <span><ng-container i18n>Mark as paid</ng-container></span>
    </button>
  }
  @if (canVoid()) {
    <button mat-menu-item (click)="voidInvoice()">
      <mat-icon>block</mat-icon>
      <span><ng-container i18n>Void</ng-container></span>
    </button>
  }
  @if (canUnvoid()) {
    <button mat-menu-item (click)="unvoidInvoice()">
      <mat-icon>undo</mat-icon>
      <span><ng-container i18n>Unvoid</ng-container></span>
    </button>
  }
  @if (canDelete()) {
    <button mat-menu-item (click)="deleteInvoice()">
      <mat-icon class="text-red-600">delete</mat-icon>
      <span class="text-red-600"><ng-container i18n>Delete</ng-container></span>
    </button>
  }
</mat-menu>

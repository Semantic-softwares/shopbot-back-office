<h2 mat-dialog-title>{{ data.title || 'Confirmation' }}</h2>
<!-- pre-line so a caller can use blank lines to separate "what breaks" from
     "when you actually need this" without resorting to HTML. -->
<mat-dialog-content class="whitespace-pre-line">{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ data.cancelText || 'Cancel' }}</button>
  <button mat-button color="warn" (click)="onConfirm()">{{ data.confirmText || 'Confirm' }}</button>
</mat-dialog-actions>

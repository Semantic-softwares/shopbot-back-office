<h2 mat-dialog-title class="!mb-1 text-lg font-semibold text-gray-900">
  {{ data.title || 'Crop photo' }}
</h2>

<mat-dialog-content class="!pt-1">
  @if (data.hint) {
    <p class="mb-3 text-xs text-gray-500">{{ data.hint }}</p>
  }

  @if (error(); as message) {
    <div class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700">{{ message }}</div>
  } @else {
    <!-- Pointer handlers live on the stage, not the handles: a fast drag
         outruns the 12px handle, and the capture set on pointerdown keeps
         delivering moves here. -->
    <div
      #stage
      class="relative select-none overflow-hidden rounded-lg bg-gray-900"
      style="height: 60vh; max-height: 26rem; touch-action: none"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp()"
      (pointercancel)="onPointerUp()"
      (pointerleave)="onPointerUp()"
    >
      @if (loading()) {
        <div class="absolute inset-0 flex items-center justify-center">
          <mat-spinner diameter="32"></mat-spinner>
        </div>
      }

      @if (imageUrl(); as url) {
        <img
          [src]="url"
          alt=""
          class="pointer-events-none absolute inset-0 h-full w-full object-contain"
          (load)="measure()"
        />

        <!-- Dimmed everywhere except the crop, using a huge spread shadow
             rather than four separate mask panels. -->
        <div
          class="absolute cursor-move"
          [ngStyle]="cropStyle()"
          style="box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); outline: 1px solid rgba(255,255,255,0.9)"
          (pointerdown)="onPointerDown($event, 'move')"
        >
          <!-- Thirds, to help line a subject up. -->
          <div class="pointer-events-none absolute inset-0" style="opacity: 0.35">
            <div class="absolute inset-y-0 left-1/3 w-px bg-white"></div>
            <div class="absolute inset-y-0 left-2/3 w-px bg-white"></div>
            <div class="absolute inset-x-0 top-1/3 h-px bg-white"></div>
            <div class="absolute inset-x-0 top-2/3 h-px bg-white"></div>
          </div>

          <span
            class="absolute -left-1.5 -top-1.5 h-3.5 w-3.5 cursor-nwse-resize rounded-sm bg-white shadow"
            (pointerdown)="onPointerDown($event, 'nw')"
          ></span>
          <span
            class="absolute -right-1.5 -top-1.5 h-3.5 w-3.5 cursor-nesw-resize rounded-sm bg-white shadow"
            (pointerdown)="onPointerDown($event, 'ne')"
          ></span>
          <span
            class="absolute -bottom-1.5 -left-1.5 h-3.5 w-3.5 cursor-nesw-resize rounded-sm bg-white shadow"
            (pointerdown)="onPointerDown($event, 'sw')"
          ></span>
          <span
            class="absolute -bottom-1.5 -right-1.5 h-3.5 w-3.5 cursor-nwse-resize rounded-sm bg-white shadow"
            (pointerdown)="onPointerDown($event, 'se')"
          ></span>
        </div>
      }
    </div>

    <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
      <span class="text-xs text-gray-500">Output {{ outputSize() }} px</span>
      <div class="flex items-center gap-2">
        <button mat-stroked-button type="button" (click)="resetCrop()">
          <mat-icon class="mr-1">restart_alt</mat-icon>Reset
        </button>
        @if (data.aspectRatio) {
          <button mat-stroked-button type="button" (click)="toggleLock()">
            <mat-icon class="mr-1">{{ lockAspect() ? 'lock' : 'lock_open' }}</mat-icon>
            {{ lockAspect() ? 'Card shape' : 'Free crop' }}
          </button>
        }
      </div>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions class="flex justify-end gap-2">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="loading() || working() || !!error()"
    (click)="confirm()"
  >
    {{ working() ? 'Cropping…' : 'Use photo' }}
  </button>
</mat-dialog-actions>

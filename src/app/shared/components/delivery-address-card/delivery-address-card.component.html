<div class="overflow-hidden rounded-lg border border-gray-200">
  <div class="relative h-44 w-full bg-gray-100">
    <div #mapEl class="h-full w-full"></div>
    @if (mapFailed()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-1 text-gray-400">
        <mat-icon>map</mat-icon>
        <span class="text-xs">Map unavailable</span>
      </div>
    }
  </div>

  <div class="flex items-start gap-2 p-3">
    <mat-icon class="!text-base text-gray-500">place</mat-icon>
    <p class="min-w-0 flex-1 text-sm text-gray-800">{{ addressLabel() }}</p>
  </div>

  <div class="flex border-t border-gray-200">
    <button
      type="button"
      mat-button
      class="!flex-1 !rounded-none"
      (click)="copyAddress()"
    >
      <mat-icon class="!text-base">{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
      {{ copied() ? 'Copied' : 'Copy address' }}
    </button>
    <a
      mat-button
      [href]="directionsUrl()"
      target="_blank"
      rel="noopener"
      class="!flex-1 !rounded-none border-l border-gray-200"
    >
      <mat-icon class="!text-base">directions</mat-icon>
      Get directions
    </a>
  </div>
</div>

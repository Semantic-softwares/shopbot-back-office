<div class="flex items-center justify-between pr-2">
  <h2 mat-dialog-title class="!mb-0">Payment</h2>
  <button mat-icon-button (click)="onCancel()" aria-label="Cancel" matTooltip="Cancel">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <!-- Total Amount Display -->
  <div class=" rounded-lg p-6 mb-6 text-center">
    <p class="text-sm text-gray-600 mb-2">Total Amount:</p>
    <p class="text-3xl font-bold text-gray-900">
      {{ data.totalAmount | number:'1.2-2' }}
    </p>
  </div>

  <!-- Payment Method Selection -->

    <mat-button-toggle-group 
      [value]="selectedPaymentMethod()"
      (change)="onPaymentMethodChange($event.value)">
      @for (method of paymentMethods; track method.id) {
        <mat-button-toggle 
          [value]="method.id">
         
            <mat-icon>{{ method.icon }}</mat-icon>
            <span>{{ method.name }}</span>
          
        </mat-button-toggle>
      }
    </mat-button-toggle-group>

  <!-- Order Note -->
  <mat-form-field appearance="outline" class="w-full mt-4">
    <mat-label>Order Note (optional)</mat-label>
    <textarea
      matInput
      rows="3"
      placeholder="Add a note for this order..."
      [ngModel]="note()"
      (ngModelChange)="note.set($event)">
    </textarea>
  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end" class="border-2 border-outline-variant">
  @if (!data.requirePayment) {
    <button
      matButton="outlined"
      color="primary"
      (click)="onSkipPayment()">
      Skip Payment
    </button>
  }
  <button
    matButton="filled" 
    color="primary" 
    [disabled]="!selectedPaymentMethod()"
    (click)="onConfirmPayment()">
    Confirm Payment
  </button>
  
</mat-dialog-actions>

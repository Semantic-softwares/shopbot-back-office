<app-page-header
  [title]="isEditMode() ? ('Edit Category' | tr) : ('New Category' | tr)"
  subtitle="Define a category for maintenance requests" i18n-subtitle
>
  <ng-container actions>
    <button mat-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      <ng-container i18n>Back</ng-container>
    </button>
  </ng-container>
</app-page-header>

<div class="px-4 py-6">
  <mat-card appearance="outlined">
    <mat-card-content class="p-4!">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label><ng-container i18n>Category Name</ng-container></mat-label>
          <input matInput formControlName="name" placeholder="e.g. Plumbing, Electrical" i18n-placeholder />
          @if (form.controls.name.hasError('required')) {
            <mat-error><ng-container i18n>Name is required</ng-container></mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label><ng-container i18n>Description</ng-container></mat-label>
          <textarea matInput formControlName="description" rows="3" placeholder="Brief description of this category" i18n-placeholder></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label><ng-container i18n>Icon (Material Icon Name)</ng-container></mat-label>
          <input matInput formControlName="icon" placeholder="e.g. plumbing, electrical_services" i18n-placeholder />
          <mat-hint><ng-container i18n>Use Material Design icon names</ng-container></mat-hint>
        </mat-form-field>

        <div class="flex justify-end gap-2 pt-2">
          <button mat-button type="button" (click)="goBack()"><ng-container i18n>Cancel</ng-container></button>
          <button
            mat-flat-button
            type="submit"
            [disabled]="form.invalid || submitting()"
          >
            @if (submitting()) {
              <mat-spinner diameter="20" class="inline-block mr-2"></mat-spinner>
            }
            @if (isEditMode()) {<ng-container i18n>Update Category</ng-container>} @else {<ng-container i18n>Create Category</ng-container>}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

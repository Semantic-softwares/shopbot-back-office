<app-page-header
  [title]="isDraftEdit() ? ('Complete Draft Lease' | tr) : isEditMode() ? ('Edit Lease' | tr) : ('Create Lease' | tr)"
  [subtitle]="('Guided lease creation wizard' | tr)">
  <ng-container actions>
    <button mat-button (click)="cancel()">
      <mat-icon class="mr-1">arrow_back</mat-icon>
      <ng-container i18n>Back</ng-container>
    </button>
    <button mat-stroked-button (click)="saveDraft()" [disabled]="isSubmitting()">
      <mat-icon class="mr-1">save</mat-icon>
      <ng-container i18n>Save Draft</ng-container>
    </button>
    <button mat-flat-button (click)="activateLease()" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <mat-spinner diameter="18" class="mr-2 inline-block"></mat-spinner>
      } @else {
        <mat-icon class="mr-1">check_circle</mat-icon>
      }
      @if (isDraftEdit()) {<ng-container i18n>Activate Lease</ng-container>} @else {<ng-container i18n>Submit Lease</ng-container>}
    </button>
  </ng-container>
</app-page-header>

<div class="px-4  py-6 max-w-6xl">
  <mat-card appearance="outlined">
    <mat-card-content class="p-4!">
      <mat-stepper class="lease-stepper" orientation="vertical" linear>
        <mat-step [stepControl]="termsGroup" label="Terms" i18n-label>
          <div class="pt-4">
            <app-lease-step-terms
              [termsGroup]="termsGroup"
              [properties]="properties()"
              [units]="units()">
            </app-lease-step-terms>
          </div>
          <div class="mt-4 flex justify-end">
            <button mat-flat-button matStepperNext [disabled]="termsGroup.invalid"><ng-container i18n>Next</ng-container></button>
          </div>
        </mat-step>

        <mat-step [stepControl]="tenantsGroup" label="Tenants" i18n-label>
          <div class="pt-4">
            <app-lease-step-tenants
              [tenantsGroup]="tenantsGroup"
              [tenants]="tenants()">
            </app-lease-step-tenants>
          </div>
          <div class="mt-4 flex justify-between">
            <button mat-button matStepperPrevious><ng-container i18n>Previous</ng-container></button>
            <button mat-flat-button matStepperNext [disabled]="tenantsGroup.invalid"><ng-container i18n>Next</ng-container></button>
          </div>
        </mat-step>

        <mat-step [stepControl]="transactionsGroup" label="Lease Transactions" i18n-label>
          <div class="pt-4">
            <app-lease-step-transactions
              [transactionsGroup]="transactionsGroup"
              [depositsArray]="depositsArray"
              [otherTransactionsArray]="otherTransactionsArray"
              [addDeposit]="addDeposit"
              [removeDeposit]="removeDeposit"
              [addOtherTransaction]="addOtherTransaction"
              [removeOtherTransaction]="removeOtherTransaction"
              [tenants]="tenants()"
              [selectedTenantIds]="tenantsGroup.get('tenantIds')?.value || []">
            </app-lease-step-transactions>
          </div>
          <div class="mt-4 flex justify-between">
            <button mat-button matStepperPrevious><ng-container i18n>Previous</ng-container></button>
            <button mat-flat-button matStepperNext [disabled]="transactionsGroup.invalid"><ng-container i18n>Next</ng-container></button>
          </div>
        </mat-step>

        <mat-step [stepControl]="utilitiesGroup" label="Utilities" i18n-label>
          <div class="pt-4">
            <app-lease-step-utilities
              [utilitiesGroup]="utilitiesGroup"
              [responsibilitiesArray]="responsibilitiesArray"
              [addUtilityResponsibility]="addUtilityResponsibility"
              [removeUtilityResponsibility]="removeUtilityResponsibility">
            </app-lease-step-utilities>
          </div>
          <div class="mt-4 flex justify-between">
            <button mat-button matStepperPrevious><ng-container i18n>Previous</ng-container></button>
            <button mat-flat-button matStepperNext [disabled]="utilitiesGroup.invalid"><ng-container i18n>Next</ng-container></button>
          </div>
        </mat-step>

        <mat-step label="Summary" i18n-label>
          <div class="pt-4">
            <app-lease-step-summary
              [leaseForm]="leaseForm"
              [properties]="properties()"
              [units]="units()"
              [tenants]="tenants()">
            </app-lease-step-summary>
          </div>

          <div class="mt-4 flex justify-start">
            <button mat-button matStepperPrevious><ng-container i18n>Previous</ng-container></button>
          </div>
        </mat-step>
      </mat-stepper>
    </mat-card-content>
  </mat-card>
</div>

<div class="hms-dashboard-container" [style.--pos-bottom-nav]="isMobile() ? '4rem' : '0px'">
  <app-toolbar 
    [title]="isMobile() ? ('POS' | tr) : ('Point of Sale' | tr)"
    [showMenuButton]="false"
    (menuToggle)="toggleSidenav()">
  </app-toolbar>

  <mat-sidenav-container>
    <!-- Desktop Side Navigation (hidden on mobile) -->
    @if (!isMobile()) {
      <mat-sidenav mode="side" [opened]="opened()" class="!w-[4.5rem] !rounded-[0px]">
        <nav class="flex flex-col gap-1 py-3">
          @for (item of navItems(); track item.link) {
            <a [routerLink]="item.link" routerLinkActive="active-sidebar-link" #rla="routerLinkActive"
              class="flex flex-col items-center justify-center gap-0.5 py-2.5 px-1 hover:bg-gray-100 transition-colors cursor-pointer rounded-xl mx-1.5">
              <mat-icon class="material-icons-outlined !text-[24px]"
                [matBadge]="item.badge ? pendingCount() : null" [matBadgeHidden]="!item.badge || pendingCount() === 0"
                matBadgeColor="warn" matBadgeSize="small">{{item.icon}}</mat-icon>
              <span class="text-[11px] font-medium text-center leading-tight">{{item.label}}</span>
            </a>
          }
        </nav>
      </mat-sidenav>
    }

    <mat-sidenav-content>
      <div [class]="isMobile() ? 'h-[calc(100vh-64px)] pb-16' : 'h-[calc(100vh-64px)]'">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <!-- Bottom navigation: phones and tablets (anything that has no side rail) -->
  @if (isMobile()) {
  <div class="fixed bottom-0 left-0 z-50 w-full h-16 bg-white border-t border-gray-200" style="background-color: var(--mat-sys-surface); border-color: var(--mat-sys-outline-variant);">
    <div class="grid h-full max-w-lg grid-cols-4 mx-auto font-medium">
      @for (item of navItems(); track item.link) {
        <a [routerLink]="item.link" routerLinkActive="active-bottom-nav" #rla="routerLinkActive"
          class="bottom-nav-item inline-flex flex-col items-center justify-center px-5 transition-colors">
          <mat-icon class="!w-6 !h-6 !text-[24px] mb-1"
            [matBadge]="item.badge ? pendingCount() : null" [matBadgeHidden]="!item.badge || pendingCount() === 0"
            matBadgeColor="warn" matBadgeSize="small">
            {{item.icon}}
          </mat-icon>
          <span class="text-xs">
            {{item.label}}
          </span>
        </a>
      }
    </div>
  </div>
  }
</div>

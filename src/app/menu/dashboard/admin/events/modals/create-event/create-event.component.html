<h2 mat-dialog-title><ng-container i18n>{{data.event ? ('Edit' | tr) : 'Add'}} Event</ng-container></h2>
<mat-dialog-content>
  <form [formGroup]="eventForm" class="flex flex-col gap-4">
    <mat-form-field appearance="outline">
      <mat-label><ng-container i18n>Title</ng-container></mat-label>
      <input matInput formControlName="title" placeholder="Enter event title" i18n-placeholder>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label><ng-container i18n>Date</ng-container></mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label><ng-container i18n>Type</ng-container></mat-label>
      <mat-select formControlName="type">
        <mat-option value="Meeting"><ng-container i18n>Meeting</ng-container></mat-option>
        <mat-option value="Call"><ng-container i18n>Call</ng-container></mat-option>
        <mat-option value="Workshop"><ng-container i18n>Workshop</ng-container></mat-option>
        <mat-option value="Review"><ng-container i18n>Review</ng-container></mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label><ng-container i18n>Client</ng-container></mat-label>
      <input matInput formControlName="client" placeholder="Enter client name" i18n-placeholder>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label><ng-container i18n>Company</ng-container></mat-label>
      <input matInput formControlName="company" placeholder="Enter company name" i18n-placeholder>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()"><ng-container i18n>Cancel</ng-container></button>
  <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="!eventForm.valid">
    @if (data.event) {<ng-container i18n>Update</ng-container>} @else {<ng-container i18n>Create</ng-container>}
  </button>
</mat-dialog-actions>

<div class="p-6">
  <h2 mat-dialog-title class="text-xl font-semibold mb-4">
    <ng-container i18n>{{ isEditMode ? ('Edit' | tr) : ('Create' | tr) }} Permission Category</ng-container>
  </h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="space-y-4">
      <mat-form-field class="w-full">
        <mat-label><ng-container i18n>Name</ng-container></mat-label>
        <input matInput formControlName="name" placeholder="Enter category name" i18n-placeholder>
        @if (form.get('name')?.hasError('required') && form.get('name')?.touched) {
          <mat-error><ng-container i18n>Name is required</ng-container></mat-error>
        }
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label><ng-container i18n>Description</ng-container></mat-label>
        <textarea matInput formControlName="description" rows="3" 
                  placeholder="Enter category description" i18n-placeholder></textarea>
        @if (form.get('description')?.hasError('required') && form.get('description')?.touched) {
          <mat-error><ng-container i18n>Description is required</ng-container></mat-error>
        }
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="mt-4">
      <button mat-button mat-dialog-close type="button"><ng-container i18n>Cancel</ng-container></button>
      <button mat-raised-button color="primary" type="submit" 
              [disabled]="form.invalid">
        @if (isEditMode) {<ng-container i18n>Update</ng-container>} @else {<ng-container i18n>Create</ng-container>}
      </button>
    </mat-dialog-actions>
  </form>
</div>

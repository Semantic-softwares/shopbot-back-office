<div class="p-6 max-w-2xl">
  <h2 mat-dialog-title class="text-xl font-semibold mb-4"><ng-container i18n>{{data ? ('Edit' | tr) : ('New' | tr)}} Corrective Action</ng-container></h2>
  
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="space-y-4">
      <!-- Title -->
      <mat-form-field class="w-full" appearance="outline">
        <mat-label><ng-container i18n>Title</ng-container></mat-label>
        <input matInput formControlName="title">
      </mat-form-field>

      <!-- Details -->
      <mat-form-field class="w-full" appearance="outline">
        <mat-label><ng-container i18n>Details</ng-container></mat-label>
        <textarea matInput formControlName="details" rows="4"></textarea>
      </mat-form-field>

      <!-- Owner -->
      <mat-form-field class="w-full" appearance="outline">
        <mat-label><ng-container i18n>Owner</ng-container></mat-label>
        <mat-select formControlName="owner">
          <mat-option *ngFor="let user of users.value()" [value]="user._id">
             {{user.name}}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- ETA -->
      <mat-form-field class="w-full" appearance="outline">
        <mat-label><ng-container i18n>ETA</ng-container></mat-label>
        <input matInput [matDatepicker]="picker" formControlName="eta">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <!-- Status -->
      <mat-form-field class="w-full" appearance="outline">
        <mat-label><ng-container i18n>Status</ng-container></mat-label>
        <mat-select formControlName="status">
          <mat-option value="Open"><ng-container i18n>Open</ng-container></mat-option>
          <mat-option value="In Progress"><ng-container i18n>In Progress</ng-container></mat-option>
          <mat-option value="Closed"><ng-container i18n>Closed</ng-container></mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="flex justify-end gap-2 mt-4">
      <button type="button" mat-button (click)="onCancel()"><ng-container i18n>Cancel</ng-container></button>
      <button type="submit" 
              mat-raised-button 
              color="primary" 
              [disabled]="form.invalid || isSubmitting()">
        @if (isSubmitting()) {<ng-container i18n>Submitting...</ng-container>} @else {<ng-container i18n>Submit</ng-container>}
      </button>
    </div>
  </form>
</div>

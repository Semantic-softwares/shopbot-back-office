<mat-card appearance="outlined">
  <mat-card-header >
    <mat-card-title>
      <ng-container i18n>Stay Details</ng-container>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (reservationForm()) {
      <form [formGroup]="reservationForm()!">
        <div class="space-y-4 py-3">
          <!-- Check-in and Check-out Date Range -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label><ng-container i18n>Stay Dates</ng-container></mat-label>
            <mat-date-range-input [rangePicker]="stayPicker">
              <input
                matStartDate
                formControlName="checkInDate"
                placeholder="Check-in date" i18n-placeholder
                (change)="onDateChange()"
              />
              <input
                matEndDate
                formControlName="checkOutDate"
                placeholder="Check-out date" i18n-placeholder
                (change)="onDateChange()"
              />
            </mat-date-range-input>
            <mat-datepicker-toggle matSuffix [for]="stayPicker"></mat-datepicker-toggle>
            <mat-hint><ng-container i18n>{{ numberOfNights() }} night(s)</ng-container></mat-hint>
            <mat-date-range-picker #stayPicker></mat-date-range-picker>
          </mat-form-field>

          <!-- Sales Person (Read-only) -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label><ng-container i18n>Sales Person</ng-container></mat-label>
            <input
              
              matInput
              [value]="salesPersonName()"
              readonly
            />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label><ng-container i18n>Number of Nights</ng-container></mat-label>
            <input
            formControlName="numberOfNights"
              matInput
              
              readonly
            />
          </mat-form-field>

          <!-- Booking Source -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label><ng-container i18n>Booking Source</ng-container></mat-label>
            <mat-select formControlName="bookingSource">
              <mat-option value=""><ng-container i18n>-- Select Source --</ng-container></mat-option>
              <mat-option value="direct"><ng-container i18n>Direct</ng-container></mat-option>
              <mat-option value="phone"><ng-container i18n>Phone</ng-container></mat-option>
              <mat-option value="online"><ng-container i18n>Online</ng-container></mat-option>
              <mat-option value="walk_in"><ng-container i18n>Walk-in</ng-container></mat-option>
              <mat-option value="booking.com"><ng-container i18n>Booking.com</ng-container></mat-option>
              <mat-option value="expedia"><ng-container i18n>Expedia</ng-container></mat-option>
              <mat-option value="airbnb"><ng-container i18n>Airbnb</ng-container></mat-option>
              <mat-option value="travel_agent"><ng-container i18n>Travel Agent</ng-container></mat-option>
              <mat-option value="corporate"><ng-container i18n>Corporate</ng-container></mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </form>
    }
  </mat-card-content>
</mat-card>

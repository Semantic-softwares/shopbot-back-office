<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title><ng-container i18n>Requests & notes</ng-container></mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div [formGroup]="getReservationForm()" class="grid grid-cols-1 gap-x-4 pt-4 md:grid-cols-2">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label><ng-container i18n>Guest requests</ng-container></mat-label>
        <textarea matInput formControlName="specialRequests" rows="3" class="text-sm"
          placeholder="e.g., High floor, late arrival, anniversary, dietary needs" i18n-placeholder></textarea>
        <mat-hint><ng-container i18n>Asked for by the guest; visible to the guest</ng-container></mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label><ng-container i18n>Internal notes</ng-container></mat-label>
        <textarea matInput formControlName="internalNotes" rows="3" class="text-sm"
          placeholder="e.g., Prefers quiet hours, VIP, previous complaint" i18n-placeholder></textarea>
        <mat-hint><ng-container i18n>Staff only; never shown to the guest</ng-container></mat-hint>
      </mat-form-field>
    </div>
  </mat-card-content>
</mat-card>

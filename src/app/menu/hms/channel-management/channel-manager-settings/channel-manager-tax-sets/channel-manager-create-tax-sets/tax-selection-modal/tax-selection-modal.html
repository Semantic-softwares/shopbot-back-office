  <h2 mat-dialog-title><ng-container i18n>Add Tax</ng-container></h2>

  @if (isLoading()) {
    <div class="flex items-center justify-center py-8">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <mat-dialog-content class="mt-6">
      @if (availableTaxes().length === 0) {
        <p class="text-gray-500 text-center py-4"><ng-container i18n>All taxes have been added to this tax set.</ng-container></p>
      } @else {
        <form [formGroup]="form">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label><ng-container i18n>Select Tax</ng-container></mat-label>
            <mat-select formControlName="taxId">
              @for (tax of availableTaxes(); track tax.id) {
                <mat-option [value]="tax.id">{{ tax.title }}</mat-option>
              }
            </mat-select>
            @if (form.get('taxId')?.hasError('required')) {
              <mat-error><ng-container i18n>Please select a tax</ng-container></mat-error>
            }
          </mat-form-field>
        </form>
      }
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="gap-2">
      <button
        matButton
        (click)="cancel()"
        [disabled]="isLoading()"
      >
        <ng-container i18n>Cancel</ng-container>
      </button>
      <button
        matButton
        color="primary"
        (click)="createNewTax()"
        [disabled]="isLoading()"
      >
        <mat-icon class="mr-1">add</mat-icon>
        <ng-container i18n>Create Tax</ng-container>
      </button>
      <button
        matButton="filled"
        color="primary"
        (click)="selectTax()"
        [disabled]="!form.valid || isLoading() || availableTaxes().length === 0"
      >
        <ng-container i18n>Select</ng-container>
      </button>
    </mat-dialog-actions>
  }

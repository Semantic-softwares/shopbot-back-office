<!-- Tailwind Navbar: flat at top, rounded/transparent on scroll -->
<header [ngClass]="navbarTransparent() ? 'top-4' : 'top-0'" class="fixed inset-x-0 z-50 transition-all duration-300">
  <div [ngClass]="navbarTransparent() ? 'mx-auto max-w-3xl' : 'mx-auto max-w-6xl'" class="px-4 transition-all duration-300 ease-in-out">
    <nav [ngClass]="navbarTransparent() 
      ? 'rounded-full border border-gray-200 bg-white/70 backdrop-blur shadow-lg'
      : 'w-full rounded-none bg-transparent shadow-none'"
      class="flex items-center justify-between px-3 sm:px-5 py-2 transition-all duration-300">
      <!-- Brand -->
      <a routerLink="/home" class="flex items-center gap-2 cursor-pointer no-underline">
        <img src="assets/logo/logo_512.png" alt="Shopbot Logo" i18n-alt class="h-8 w-8">
        <span class="font-semibold text-lg" style="color: #6750a4;"><ng-container i18n>Shopbot</ng-container></span>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-8 text-gray-900">
        <button mat-button (click)="scrollToFeatures()" class="!text-gray-900"><ng-container i18n>Features</ng-container></button>
        <button mat-button [matMenuTriggerFor]="productMenu" class="!text-gray-900"><ng-container i18n>Products</ng-container></button>
        <mat-menu #productMenu="matMenu">
          <button mat-menu-item (click)="navigateToFeature('pms')">
            <mat-icon>hotel</mat-icon> <ng-container i18n>Property Management</ng-container>
          </button>
          <button mat-menu-item (click)="navigateToFeature('pos')">
            <mat-icon>point_of_sale</mat-icon> <ng-container i18n>POS - Food & Beverage</ng-container>
          </button>
          <button mat-menu-item (click)="navigateToFeature('accounting')">
            <mat-icon>account_balance</mat-icon> <ng-container i18n>Accounting & Expenses</ng-container>
          </button>
          <button mat-menu-item (click)="navigateToFeature('inventory')">
            <mat-icon>inventory_2</mat-icon> <ng-container i18n>Purchasing & Inventory</ng-container>
          </button>
          <button mat-menu-item (click)="navigateToFeature('housekeeping')">
            <mat-icon>cleaning_services</mat-icon> <ng-container i18n>Housekeeping</ng-container>
          </button>
          <button mat-menu-item (click)="navigateToFeature('reporting')">
            <mat-icon>analytics</mat-icon> <ng-container i18n>Reporting & Analytics</ng-container>
          </button>
          <button mat-menu-item (click)="navigateToFeature('booking-engine')">
            <mat-icon>language</mat-icon> <ng-container i18n>Booking Engine</ng-container>
          </button>
          <button mat-menu-item (click)="navigateToFeature('channel-manager')">
            <mat-icon>sync</mat-icon> <ng-container i18n>Channel Manager</ng-container>
          </button>
        </mat-menu>
        <button mat-button (click)="scrollToPricing()" class="!text-gray-900"><ng-container i18n>Pricing</ng-container></button>
        <button mat-button (click)="navigateToDownloads()" class="!text-gray-900"><ng-container i18n>Downloads</ng-container></button>
      </div>

      <!-- Right actions -->
      <div class="flex items-center gap-3">
        <button mat-flat-button color="primary" (click)="navigateToSignup()">
          <ng-container i18n>Start now</ng-container>
        </button>
        <!-- Mobile menu toggle (hidden on md and up) -->
        <div class="block md:hidden">
          <button mat-icon-button (click)="toggleMobileMenu()">
            <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
          </button>
        </div>
      </div>
    </nav>
  </div>

  <!-- Mobile Menu Dropdown -->
  @if (mobileMenuOpen()) {
  <div class="md:hidden bg-white shadow-lg">
    <div class="max-w-6xl mx-auto px-6 py-4 space-y-1">
      <button mat-button class="!w-full !justify-start !text-gray-900 !text-base" (click)="scrollToFeatures()"><ng-container i18n>Features</ng-container></button>
      <button mat-button class="!w-full !justify-start !text-gray-900 !text-base" (click)="scrollToPricing()"><ng-container i18n>Pricing</ng-container></button>
      <button mat-button class="!w-full !justify-start !text-gray-900 !text-base" (click)="navigateToDownloads()"><ng-container i18n>Downloads</ng-container></button>
      <button mat-button class="!w-full !justify-start !text-gray-900 !text-base" [matMenuTriggerFor]="mobileProductMenu"><ng-container i18n>Products</ng-container></button>
      <mat-menu #mobileProductMenu="matMenu">
        <button mat-menu-item (click)="navigateToFeature('pms')">
          <mat-icon>hotel</mat-icon> <ng-container i18n>Property Management</ng-container>
        </button>
        <button mat-menu-item (click)="navigateToFeature('pos')">
          <mat-icon>point_of_sale</mat-icon> <ng-container i18n>POS - Food & Beverage</ng-container>
        </button>
        <button mat-menu-item (click)="navigateToFeature('accounting')">
          <mat-icon>account_balance</mat-icon> <ng-container i18n>Accounting & Expenses</ng-container>
        </button>
        <button mat-menu-item (click)="navigateToFeature('inventory')">
          <mat-icon>inventory_2</mat-icon> <ng-container i18n>Purchasing & Inventory</ng-container>
        </button>
        <button mat-menu-item (click)="navigateToFeature('housekeeping')">
          <mat-icon>cleaning_services</mat-icon> <ng-container i18n>Housekeeping</ng-container>
        </button>
        <button mat-menu-item (click)="navigateToFeature('reporting')">
          <mat-icon>analytics</mat-icon> <ng-container i18n>Reporting & Analytics</ng-container>
        </button>
        <button mat-menu-item (click)="navigateToFeature('booking-engine')">
          <mat-icon>language</mat-icon> <ng-container i18n>Booking Engine</ng-container>
        </button>
        <button mat-menu-item (click)="navigateToFeature('channel-manager')">
          <mat-icon>sync</mat-icon> <ng-container i18n>Channel Manager</ng-container>
        </button>
      </mat-menu>
    </div>
  </div>
  }

  <!-- Spacer: only needed when navbar is flat and fixed at the very top -->
  <div [ngClass]="navbarTransparent() ? 'h-0' : 'h-16'"></div>
</header>
